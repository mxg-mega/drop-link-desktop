<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DropLink</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>"
    />
    <style>
      {% raw %}
      @font-face{font-family:"Instrument Sans";src:local("Instrument Sans"),url(/static/fonts/InstrumentSans.woff2) format("woff2");font-display:swap}
      :root{
        --bg:#EAEFF2;--surface:#fff;--ink:#12202B;--mute:#6B7C89;--line:#D8E0E5;
        --laptop:#3D4FE0;--laptop-soft:#E6E9FC;--phone:#0F9D77;--phone-soft:#DCF2EA;--danger:#D14343;
      }
      @media (prefers-color-scheme:dark){
        :root{--bg:#0E161D;--surface:#17232D;--ink:#E7EEF3;--mute:#8CA0AF;--line:#26343F;
          --laptop:#8C98FF;--laptop-soft:#222B5E;--phone:#3DD6A8;--phone-soft:#123B30;--danger:#FF7A7A}
      }
      *{box-sizing:border-box;margin:0}
      html,body{height:100%}
      body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:15px}
      button,input,textarea{font:inherit;color:inherit}
      button{cursor:pointer;background:none;border:0}
      :focus-visible{outline:2px solid var(--laptop);outline-offset:2px}
      .ic{display:inline-flex;vertical-align:middle}
      .ic svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

      .app{display:grid;grid-template-columns:300px 1fr;height:100vh}

      /* sidebar */
      .side{background:#12202B;color:#fff;padding:24px 20px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
      .brand{font-size:22px;font-weight:700;letter-spacing:-.02em}
      .conn{background:rgba(255,255,255,.07);border-radius:20px;padding:16px}
      .status{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
      .dot{width:8px;height:8px;border-radius:50%;background:#4ADE9F;animation:pulse 1.8s infinite}
      .dot.off{background:#FF7A7A;animation:none}
      @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,159,.55)}100%{box-shadow:0 0 0 8px rgba(74,222,159,0)}}
      .addr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;background:rgba(255,255,255,.08);border-radius:12px;padding:9px 12px;font-size:14px;font-variant-numeric:tabular-nums}
      .addr button{color:#fff;opacity:.8;padding:2px}
      .addr button:hover{opacity:1}
      .qrbox{margin-top:14px;background:#fff;border-radius:16px;padding:10px;display:flex;justify-content:center}
      .qrbox img{width:100%;max-width:200px;image-rendering:pixelated;display:block}
      .qrcap{margin-top:10px;font-size:12px;color:#9FB3C1;line-height:1.4}
      .nav{display:flex;flex-direction:column;gap:2px}
      .nav button{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;color:#B8C8D3;font-weight:500;text-align:left}
      .nav button:hover{background:rgba(255,255,255,.06)}
      .nav button.on{background:rgba(255,255,255,.12);color:#fff}
      .nav span{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}

      /* main */
      .main{display:flex;flex-direction:column;min-width:0;height:100vh}
      .top{display:flex;align-items:center;justify-content:space-between;padding:22px 32px 10px}
      .top h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
      .pill{display:none;align-items:center;gap:8px;background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500}
      .feed{flex:1;overflow-y:auto;padding:8px 32px 16px;display:flex;flex-direction:column;gap:18px}
      .feed>*{width:100%;max-width:760px;margin-inline:auto}
      .empty{margin-block:auto;text-align:center;color:var(--mute);line-height:1.6}
      .empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

      .row{display:flex;flex-direction:column;gap:5px}
      .row.mine{align-items:flex-end}.row.theirs{align-items:flex-start}
      .meta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mute)}
      .row.mine .meta{flex-direction:row-reverse}
      .chip{width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center}
      .chip.laptop{background:var(--laptop-soft);color:var(--laptop)}
      .chip.phone{background:var(--phone-soft);color:var(--phone)}
      .bwrap{display:flex;align-items:flex-start;gap:6px;max-width:100%}
      .bubble{background:var(--surface);padding:12px 14px;max-width:min(520px,100%);min-width:0;border-top:3px solid}
      .bubble.laptop{border-color:var(--laptop);border-radius:18px 4px 18px 18px}
      .bubble.phone{border-color:var(--phone);border-radius:4px 18px 18px 18px}
      .bubble.click{cursor:pointer}
      .txt{line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
      .lnk{display:flex;gap:8px;align-items:center;color:var(--laptop);overflow-wrap:anywhere}
      .bubble.phone .lnk{color:var(--phone)}
      .img img{display:block;max-width:100%;max-height:300px;border-radius:12px;cursor:zoom-in;background:var(--bg)}
      .img small,.file small{display:block;color:var(--mute);font-size:12px;margin-top:6px}
      .file{display:flex;gap:12px;align-items:center}
      .file small{margin-top:1px}
      .file b{font-weight:600;overflow-wrap:anywhere}
      .fi{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
      .bubble.laptop .fi{background:var(--laptop-soft);color:var(--laptop)}
      .bubble.phone .fi{background:var(--phone-soft);color:var(--phone)}
      .bar{height:4px;border-radius:2px;background:var(--line);margin-top:10px;overflow:hidden;min-width:200px}
      .bar i{display:block;height:100%;width:0;background:var(--laptop);transition:width .15s}
      .acts{display:flex;gap:2px;opacity:0;transition:opacity .12s}
      .row:hover .acts,.row:focus-within .acts{opacity:1}
      .ab{width:32px;height:32px;border-radius:10px;color:var(--mute);display:inline-flex;align-items:center;justify-content:center}
      .ab:hover{background:var(--surface);color:var(--ink)}
      .ab.del:hover{color:var(--danger)}

      /* composer */
      .composer{display:flex;align-items:flex-end;gap:8px;width:calc(100% - 64px);max-width:760px;margin:0 auto;background:var(--surface);border-radius:26px;padding:6px}
      .composer textarea{flex:1;resize:none;border:0;background:none;outline:none;padding:11px 6px;max-height:140px;line-height:1.4}
      .iconbtn,.send{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
      .iconbtn{color:var(--mute)}
      .iconbtn:hover{background:var(--bg);color:var(--ink)}
      .send{background:var(--line);color:#fff;transition:background .15s}
      .send.ready{background:var(--laptop)}
      .hint{text-align:center;color:var(--mute);font-size:12px;padding:8px 0 14px}

      /* overlays */
      .drop{position:fixed;inset:0;background:rgba(61,79,224,.88);color:#fff;display:none;align-items:center;justify-content:center;font-size:24px;font-weight:700;z-index:30;pointer-events:none}
      .drop.on{display:flex}
      .drop div{border:3px dashed rgba(255,255,255,.7);border-radius:28px;padding:56px 72px}
      .lb{position:fixed;inset:0;background:rgba(10,18,24,.88);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
      .lb img{max-width:100%;max-height:78vh;border-radius:14px}
      .lb .lbbtns{display:flex;gap:10px}
      .lb a,.lb button{background:#fff;color:#12202B;border-radius:12px;padding:10px 16px;font-weight:600;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
      .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:500;z-index:50}
      .banner{position:fixed;top:0;left:0;right:0;background:var(--danger);color:#fff;padding:8px;text-align:center;font-size:13px;font-weight:500;z-index:60;display:none}
      .banner.show{display:block}

      @media (max-width:820px){
        .app{grid-template-columns:1fr}
        .side{display:none}
        .pill{display:inline-flex}
        .top,.feed{padding-inline:16px}
        .composer{width:calc(100% - 24px)}
        .acts{opacity:1}
      }
      @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
      {% endraw %}
    </style>
  </head>
  <body data-url="{{ full_url }}">
    <div class="app">
      <aside class="side">
        <div class="brand">DropLink</div>

        <div class="conn">
          <div class="status">
            <span class="dot"></span><span id="statusText">Connecting…</span>
          </div>
          <div class="addr">
            <span id="addr">{{ full_url }}</span>
            <button
              id="copyAddr"
              aria-label="Copy address"
              data-icon="copy"
            ></button>
          </div>
          <div class="qrbox">
            <img
              src="data:image/png;base64,{{ qr_code }}"
              alt="QR code for {{ full_url }}"
            />
          </div>
          <p class="qrcap">
            Scan this from the phone app to connect. The address changes when
            the hotspot restarts.
          </p>
        </div>

        <nav class="nav" id="nav">
          <button data-filter="all" class="on">
            Everything <span data-count="all">0</span>
          </button>
          <button data-filter="text">
            Text <span data-count="text">0</span>
          </button>
          <button data-filter="links">
            Links <span data-count="links">0</span>
          </button>
          <button data-filter="images">
            Images <span data-count="images">0</span>
          </button>
          <button data-filter="files">
            Files <span data-count="files">0</span>
          </button>
        </nav>
      </aside>

      <main class="main">
        <header class="top">
          <h1>Shelf</h1>
          <span class="pill"
            ><span class="dot"></span><span id="pillText">…</span></span
          >
        </header>

        <section class="feed" id="feed" aria-live="polite"></section>

        <form class="composer" id="composer" autocomplete="off">
          <label class="iconbtn" title="Attach files" tabindex="0">
            <input type="file" id="file" multiple hidden />
            <span data-icon="clip"></span>
          </label>
          <textarea
            id="input"
            rows="1"
            placeholder="Send text or a link to your phone"
            aria-label="Message"
          ></textarea>
          <button
            class="send"
            id="sendBtn"
            type="submit"
            aria-label="Send"
            data-icon="send"
          ></button>
        </form>
        <p class="hint">
          Drop files anywhere. Ctrl+V pastes screenshots and copied files.
        </p>
      </main>
    </div>

    <div class="drop" id="drop"><div>Drop to send to phone</div></div>
    <div class="banner" id="unreachableBanner">Server unreachable, showing saved copy</div>

    <script>
      {% raw %}
      (() => {
        const $ = (s) => document.querySelector(s);
        const IMG = /\.(png|jpe?g|gif|webp|bmp|svg|avif)$/i;
        const PATHS = {
          laptop: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/>',
          phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
          file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
          link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
          copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
          download: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/>',
          trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/>',
          clip: '<path d="m21 11-9 9a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/>',
          send: '<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
        };

        // ---- tiny helpers ----
        function icon(name, size = 18) {
          const s = document.createElement('span');
          s.className = 'ic';
          s.innerHTML = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24">' + PATHS[name] + '</svg>';
          return s;
        }
        function h(tag, props, ...kids) {
          const el = document.createElement(tag);
          for (const [k, v] of Object.entries(props || {})) {
            if (v == null || v === false) continue;
            if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
            else el.setAttribute(k, v);
          }
          kids.flat().forEach((c) => {
            if (c == null || c === false) return;
            el.append(c.nodeType ? c : document.createTextNode(c));
          });
          return el;
        }
        const fileUrl = (i) => '/download/' + encodeURIComponent(i.name);
        const isImg = (i) => i.type === 'file' && IMG.test(i.name || '');
        const fmt = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : b < 1073741824 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1073741824).toFixed(2) + ' GB';
        // Single place to add an auth token later.
        const api = (path, opts) => fetch(path, opts).then((r) => { if (!r.ok) throw new Error(r.status); return r; });

        let toastTimer;
        function toast(msg) {
          document.querySelectorAll('.toast').forEach((t) => t.remove());
          document.body.append(h('div', { class: 'toast', role: 'status' }, msg));
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => document.querySelectorAll('.toast').forEach((t) => t.remove()), 1600);
        }

        // http://<ip> is not a secure context, so navigator.clipboard may be missing.
        async function copy(text) {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text);
            } else {
              const t = h('textarea', { style: 'position:fixed;opacity:0' });
              t.value = text;
              document.body.append(t);
              t.select();
              document.execCommand('copy');
              t.remove();
            }
            toast('Copied');
          } catch (e) { toast('Could not copy'); }
        }

        // ---- state ----
        const state = { items: [], pending: [], filter: 'all', online: false, sig: null, stick: true, latestSeq: 0, phoneCursorSeq: null, phoneOnline: false };
        let seq = 0;

        function visible() {
          const f = state.filter;
          return state.items.filter((i) =>
            f === 'all' ||
            (f === 'text' && i.type === 'text') ||
            (f === 'links' && i.type === 'link') ||
            (f === 'images' && isImg(i)) ||
            (f === 'files' && i.type === 'file' && !isImg(i)));
        }

        // ---- rendering ----
        function chip(from) {
          return h('span', { class: 'chip ' + from }, icon(from, 13));
        }

        function card(i) {
          const mine = i.from === 'laptop';
          let body;
          if (i.type === 'text') {
            body = h('p', { class: 'txt' }, i.text);
          } else if (i.type === 'link') {
            body = h('a', { class: 'lnk', href: i.text, target: '_blank', rel: 'noopener' }, icon('link', 16), h('span', null, i.text));
          } else if (isImg(i)) {
            body = h('div', { class: 'img' },
              h('img', { src: fileUrl(i), alt: i.name, loading: 'lazy', onclick: () => lightbox(i) }),
              h('small', null, i.name + ' · ' + i.size));
          } else {
            body = h('div', { class: 'file' },
              h('span', { class: 'fi' }, icon('file', 20)),
              h('div', null, h('b', null, i.name), h('small', null, i.size)));
          }

          // Delivery state for laptop-origin items
          let deliveryHint = null;
          if (mine && i.seq) {
            const waiting = state.phoneCursorSeq === null || i.seq > state.phoneCursorSeq;
            deliveryHint = h('small', { style: 'display:block;margin-top:4px;color:var(--mute);font-size:11px' },
              waiting ? 'Waiting for phone…' : 'Delivered');
          }

          const bubble = h('div', {
            class: 'bubble ' + i.from + (i.type === 'text' ? ' click' : ''),
            onclick: () => { if (i.type === 'text') copy(i.text); },
          }, [body, deliveryHint].filter(Boolean));

          const acts = h('div', { class: 'acts' },
            (i.type === 'text' || i.type === 'link') && h('button', { class: 'ab', title: 'Copy', 'aria-label': 'Copy', onclick: () => copy(i.text) }, icon('copy')),
            i.type === 'file' && h('a', { class: 'ab', title: 'Download', 'aria-label': 'Download', href: fileUrl(i), download: i.name }, icon('download')),
            h('button', { class: 'ab del', title: 'Delete', 'aria-label': 'Delete', onclick: () => remove(i) }, icon('trash')));

          return h('article', { class: 'row ' + (mine ? 'mine' : 'theirs') },
            h('div', { class: 'meta' }, chip(i.from), (mine ? 'Laptop' : 'Phone') + ' · ' + i.time),
            h('div', { class: 'bwrap' }, mine ? [acts, bubble] : [bubble, acts]));
        }

        function pendingCard(j) {
          return h('article', { class: 'row mine', 'data-job': j.id },
            h('div', { class: 'meta' }, chip('laptop'), j.error ? 'Upload failed' : 'Sending…'),
            h('div', { class: 'bwrap' },
              h('div', { class: 'bubble laptop' },
                h('div', { class: 'file' },
                  h('span', { class: 'fi' }, icon('file', 20)),
                  h('div', null, h('b', null, j.name), h('small', null, j.size))),
                !j.error && h('div', { class: 'bar' }, h('i', null)),
                j.error && h('button', { class: 'ab', onclick: () => { state.pending = state.pending.filter((x) => x !== j); render(); } }, 'Dismiss'))));
        }

        function counts() {
          const c = { all: state.items.length, text: 0, links: 0, images: 0, files: 0 };
          state.items.forEach((i) => {
            if (i.type === 'text') c.text++;
            else if (i.type === 'link') c.links++;
            else if (isImg(i)) c.images++;
            else if (i.type === 'file') c.files++;
          });
          document.querySelectorAll('[data-count]').forEach((el) => { el.textContent = c[el.dataset.count]; });
        }

        function render() {
          const feed = $('#feed');
          const near = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
          feed.replaceChildren();
          const list = visible();
          if (!list.length && !state.pending.length) {
            feed.append(h('div', { class: 'empty' },
              h('b', null, state.filter === 'all' ? 'Nothing shared yet' : 'Nothing in this view'),
              'Type below, drop a file here, or paste a screenshot.'));
          }
          list.forEach((i) => feed.append(card(i)));
          state.pending.forEach((j) => feed.append(pendingCard(j)));
          counts();
          if (near || state.stick) { feed.scrollTop = feed.scrollHeight; state.stick = false; }
        }

        function renderStatus() {
          const on = state.online;
          document.querySelectorAll('.dot').forEach((d) => d.classList.toggle('off', !on));
          $('#statusText').textContent = on ? 'Server running' : 'Server unreachable';
          $('#pillText').textContent = state.phoneOnline ? 'Phone connected' : 'Waiting for phone';
        }

        function lightbox(i) {
          const close = () => { lb.remove(); document.removeEventListener('keydown', esc); };
          const esc = (e) => { if (e.key === 'Escape') close(); };
          const lb = h('div', { class: 'lb', onclick: (e) => { if (e.target === lb) close(); } },
            h('img', { src: fileUrl(i), alt: i.name }),
            h('div', { class: 'lbbtns' },
              h('a', { href: fileUrl(i), download: i.name }, icon('download', 16), 'Download'),
              h('button', { onclick: close }, 'Close')));
          document.addEventListener('keydown', esc);
          document.body.append(lb);
        }

        // ---- data ----
        async function refresh() {
          if (document.hidden) return;
          try {
            // Use sync endpoint with latestSeq
            const resp = await api('/sync?after=' + state.latestSeq);
            const data = await resp.json();
            state.online = true;
            $('#unreachableBanner').classList.remove('show');
            
            if (data.full_resync) {
              // Full resync: replace everything
              state.items = data.items;
            } else {
              // Incremental: merge by id, remove deleted
              const existingIds = new Set(state.items.map(i => i.id));
              data.items.forEach(i => {
                const idx = state.items.findIndex(x => x.id === i.id);
                if (idx >= 0) {
                  state.items[idx] = i;
                } else {
                  state.items.push(i);
                }
              });
              // Remove deleted items
              if (data.deleted && data.deleted.length) {
                state.items = state.items.filter(i => !data.deleted.includes(i.id));
              }
            }
            
            state.latestSeq = data.latest_seq;
            state.sig = state.items.map((i) => i.id).join(',');
            saveState();
            render();
          } catch (e) { 
            state.online = false;
            // Try to load from localStorage if server unreachable
            if (!state.items.length) {
              loadState();
              if (state.items.length) {
                render();
                $('#unreachableBanner').classList.add('show');
              }
            }
          }
          renderStatus();
        }

        async function updatePing() {
          try {
            const data = await (await api('/ping')).json();
            state.phoneOnline = data.phone_online;
            state.phoneCursorSeq = data.phone_cursor_seq;
            renderStatus();
            render(); // Re-render to update delivery states
          } catch (e) {
            // Ignore ping errors
          }
        }

        function saveState() {
          try {
            const toSave = { items: state.items, latestSeq: state.latestSeq };
            localStorage.setItem('droplink_state', JSON.stringify(toSave));
          } catch (e) {
            // localStorage might be disabled or full
          }
        }

        function loadState() {
          try {
            const saved = localStorage.getItem('droplink_state');
            if (saved) {
              const data = JSON.parse(saved);
              if (data.items && Array.isArray(data.items)) {
                state.items = data.items;
                state.latestSeq = data.latestSeq || 0;
              }
            }
          } catch (e) {
            // Invalid or no saved state
          }
        }

        // Simple UUID v4 generator (for non-secure contexts)
        function generateUUID() {
          if (typeof crypto !== 'undefined' && crypto.randomUUID) {
            return crypto.randomUUID();
          }
          return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            const r = Math.random() * 16 | 0;
            const v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
          });
        }

        async function remove(i) {
          if (i.type === 'file' && !confirm('Delete ' + i.name + ' from the laptop?')) return;
          try { await api('/history/' + encodeURIComponent(i.id), { method: 'DELETE' }); toast('Deleted'); refresh(); }
          catch (e) { toast('Could not delete'); }
        }

        async function sendText() {
          const input = $('#input');
          const text = input.value.trim();
          if (!text) return;
          input.value = '';
          sizeInput();
          const body = new FormData();
          body.append('text', text);
          body.append('origin', 'laptop');
          body.append('client_id', generateUUID());
          try { await api('/text', { method: 'POST', body }); state.stick = true; refresh(); }
          catch (e) { input.value = text; sizeInput(); toast('Could not send. Is the server running?'); }
        }

        function upload(file) {
          const job = { id: 'p' + (++seq), name: file.name || 'file', size: fmt(file.size), error: false };
          state.pending.push(job);
          state.stick = true;
          render();
          const fd = new FormData();
          fd.append('file', file, job.name);
          fd.append('origin', 'laptop');
          fd.append('client_id', generateUUID());
          const xhr = new XMLHttpRequest();
          xhr.open('POST', '/upload');
          xhr.upload.onprogress = (e) => {
            if (!e.lengthComputable) return;
            const bar = document.querySelector('[data-job="' + job.id + '"] .bar i');
            if (bar) bar.style.width = Math.round((e.loaded / e.total) * 100) + '%';
          };
          const fail = () => { job.error = true; render(); };
          xhr.onload = () => {
            if (xhr.status < 300) { state.pending = state.pending.filter((j) => j !== job); state.sig = null; refresh(); }
            else fail();
          };
          xhr.onerror = fail;
          xhr.send(fd);
        }

        // ---- input wiring ----
        const input = $('#input');
        function sizeInput() {
          input.style.height = 'auto';
          input.style.height = Math.min(input.scrollHeight, 140) + 'px';
          $('#sendBtn').classList.toggle('ready', input.value.trim().length > 0);
        }
        input.addEventListener('input', sizeInput);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
        });
        $('#composer').addEventListener('submit', (e) => { e.preventDefault(); sendText(); });
        $('#file').addEventListener('change', (e) => { [...e.target.files].forEach(upload); e.target.value = ''; });

        // drag & drop anywhere
        let depth = 0;
        const drop = $('#drop');
        addEventListener('dragenter', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { depth++; drop.classList.add('on'); } });
        addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) drop.classList.remove('on'); });
        addEventListener('dragover', (e) => e.preventDefault());
        addEventListener('drop', (e) => {
          e.preventDefault();
          depth = 0;
          drop.classList.remove('on');
          [...(e.dataTransfer ? e.dataTransfer.files : [])].forEach(upload);
        });

        // paste: files send immediately, text lands in the composer
        addEventListener('paste', (e) => {
          const cd = e.clipboardData;
          if (!cd) return;
          const files = [...cd.files];
          if (files.length) {
            e.preventDefault();
            files.forEach((f) => {
              const generic = !f.name || /^image\.\w+$/i.test(f.name);
              const ext = (f.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
              const stamp = new Date().toTimeString().slice(0, 8).replace(/:/g, '');
              upload(generic ? new File([f], 'pasted-' + stamp + '.' + ext, { type: f.type }) : f);
            });
            return;
          }
          const t = cd.getData('text');
          if (t && document.activeElement !== input) {
            e.preventDefault();
            input.value += t;
            input.focus();
            sizeInput();
          }
        });

        // ---- sidebar ----
        $('#nav').addEventListener('click', (e) => {
          const b = e.target.closest('button[data-filter]');
          if (!b) return;
          state.filter = b.dataset.filter;
          document.querySelectorAll('#nav button').forEach((x) => x.classList.toggle('on', x === b));
          state.stick = true;
          render();
        });
        $('#copyAddr').addEventListener('click', () => copy(document.body.dataset.url));

        document.querySelectorAll('[data-icon]').forEach((el) => el.append(icon(el.dataset.icon, el.id === 'sendBtn' ? 19 : 20)));

        // ---- go ----
        loadState();
        render();
        renderStatus();
        refresh();
        updatePing();
        setInterval(refresh, 2000);
        setInterval(updatePing, 3000);
        document.addEventListener('visibilitychange', refresh);
      })();
      {% endraw %}
    </script>
  </body>
</html>
